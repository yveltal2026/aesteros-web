<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -20 768 266" role="img" aria-label="Temas en las respuestas abiertas, agrupados con IA"><style>text{font-family:Epilogue,sans-serif;fill:#000}.t{font-size:13px}.tb{font-size:13px;font-weight:600}.tn{font-size:12px;font-weight:600}.s{font-size:11px;fill:#5C564B}.q{font-size:12px;font-style:italic;fill:#5C564B}.ns{opacity:.38}.hop{display:none}</style><rect x="-24" y="-20" width="768" height="266" fill="#FFFDF8"/><defs><pattern id="ht8" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><rect width="2.6" height="6" fill="#FFB000"/></pattern></defs><text x="236" y="32" class="t" text-anchor="end" >Se ve fresca y limpia</text><rect class="gb gbl" style="--i:0" x="250" y="16" width="312.79999999999995" height="22" fill="url(#ht8)" stroke="#FFB000" stroke-width="1.5"/><text x="570.8" y="32" class="tb gf" text-anchor="start" >34 %</text><text x="250" y="55" class="q gf" text-anchor="start" >«Se me antojó, parece agua de verdad fría.»</text><text x="236" y="84" class="t" text-anchor="end" >No entiendo qué sabor es</text><rect class="gb gbl" style="--i:2" x="250" y="68" width="202.39999999999998" height="22" fill="url(#ht8)" stroke="#FFB000" stroke-width="1.5"/><text x="460.4" y="84" class="tb gf" text-anchor="start" >22 %</text><text x="250" y="107" class="q gf" text-anchor="start" >«¿Es de limón o solo lo trae de adorno?»</text><text x="236" y="136" class="t" text-anchor="end" >El precio no se ve</text><rect class="gb gbl" style="--i:4" x="250" y="120" width="156.39999999999998" height="22" fill="url(#ht8)" stroke="#FFB000" stroke-width="1.5"/><text x="414.4" y="136" class="tb gf" text-anchor="start" >17 %</text><text x="250" y="159" class="q gf" text-anchor="start" >«Tuve que buscar cuánto cuesta.»</text><text x="236" y="188" class="t" text-anchor="end" >Me recuerda a otra marca</text><rect class="gb gbl" style="--i:6" x="250" y="172" width="101.19999999999999" height="22" fill="url(#ht8)" stroke="#FFB000" stroke-width="1.5"/><text x="359.2" y="188" class="tb gf" text-anchor="start" >11 %</text><text x="250" y="211" class="q gf" text-anchor="start" >«Pensé que era de las de siempre.»</text></svg>